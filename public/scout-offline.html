<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b40"><title>مرقوريوس — العمل دون اتصال</title><style>@font-face{font-family:Cairo;src:url('/assets/cairo-arabic.woff2')}*{box-sizing:border-box}body{font-family:Cairo,system-ui,sans-serif;background:#f1f4f3;color:#102b40;max-width:720px;margin:30px auto;padding:18px;line-height:1.9}label{display:block;margin:16px 0}input,select,textarea,button{font:inherit;width:100%;min-height:46px;border:1px solid #cbd7d0;border-radius:8px;padding:10px}button{background:#a52b38;color:white;cursor:pointer;margin-top:8px}section{background:white;padding:20px;border-radius:12px;margin:20px 0}.status{white-space:pre-wrap}a{color:#a52b38}body{background:#f5f6fa;color:#183346;padding:24px}h1{font-size:28px;line-height:1.5}h1:before{content:'✦';display:block;color:#b89760;font-size:33px;margin-bottom:18px}p{font-size:12px;color:#788795}section{border:1px solid #e6e9ed;border-radius:18px;padding:24px;box-shadow:0 3px 8px #18334604}label{font-size:12px;font-weight:600}input,select,textarea{background:#fcfdfe;border-color:#dfe5eb;border-radius:10px;font-size:16px;color:#243e50}button{background:#92313c;border-color:#92313c;border-radius:10px;font-size:12px;min-height:46px}a{color:#92313c}:focus-visible{outline:3px solid #bd9b62;outline-offset:3px}</style><h1>شغل المجموعة يكمّل.</h1><p>نسخة جهاز محدودة. لا يوجد اعتماد أو صرف أو تسليم عهدة دون اتصال. كل سجل هنا ينتظر تأكيد الخادم.</p><p id="status" class="status" role="status"></p><label>المجموعة المحفوظة<select id="group"></select></label><section id="record" hidden><label>الاجتماع<select id="meeting"></select></label><label>الفرد<select id="member"></select></label><label>الحضور<select id="attendance"><option value="present">حاضر</option><option value="late">متأخر</option><option value="absent">غائب</option><option value="excused">بعذر</option></select></label><button id="saveAttendance">حفظ الحضور على الجهاز</button><label>ما قدمته فعليًا في الاجتماع<textarea id="notes" maxlength="1500"></textarea></label><button id="saveDelivery">حفظ التنفيذ على الجهاز</button><label>نتيجة الدرس<select id="assessment"><option value="not_evaluated">لم يُقيّم</option><option value="passed">اجتاز</option><option value="not_passed">لم يجتز</option></select></label><button id="saveAssessment">حفظ محاولة التقييم على الجهاز</button><button id="sync">مزامنة مع الخادم بعد رجوع الاتصال</button></section><p><a href="/console">فتح المجموعة مع الإنترنت ومراجعة التعارضات</a></p><script src="/scout-offline.js" defer></script></html>
