<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b40"><title>مرقوريوس — لا يوجد اتصال</title><style>body{font-family:system-ui,sans-serif;background:#f1f4f3;color:#102b40;max-width:560px;margin:12vh auto;padding:24px;line-height:1.9}a{display:inline-block;background:#a52b38;color:white;padding:12px 24px;border-radius:8px;text-decoration:none}</style><h1>نرجع نتصل ونكمّل.</h1><p>لا يوجد اتصال حاليًا. لو سجلت حضورًا والصفحة مفتوحة، تظل عملياته محفوظة على هذا الجهاز لحين المزامنة.</p><p>فتح التطبيق من جديد يتطلب اتصالًا في هذه النسخة. بعد رجوع الإنترنت افتح المجموعة واضغط «مزامنة ومراجعة التعارضات».</p><a href="/me">إعادة المحاولة</a></html>
